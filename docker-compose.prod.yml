x-common: &common
  restart: always
  env_file: .env.production
  networks:
    - peakflow
    - infra-net

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - peakflow
    deploy:
      resources:
        limits:
          memory: 192m

  builder:
    <<: *common
    image: ghcr.io/rakibj/peakflow-builder:latest
    ports:
      - "3100:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz || exit 1"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2048m

  viewer:
    <<: *common
    image: ghcr.io/rakibj/peakflow-viewer:latest
    ports:
      - "3101:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz || exit 1"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  peakflow:
    driver: bridge
  infra-net:
    external: true
    name: infra-net

volumes:
  redis-data:
